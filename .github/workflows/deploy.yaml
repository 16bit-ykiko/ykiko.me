name: pages

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          run-install: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check scripts
        run: npm run check

      - name: Test scripts
        run: npm test

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          run-install: false

      - name: Install dependencies
        run: npm ci

      - name: Sync articles from zhihu
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          ZHIHU_COOKIE: ${{ secrets.ZHIHU_COOKIE }}
        run: node scripts/zhihu_cli.ts sync

      - name: Commit synced articles
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A website/content/zh-cn/articles website/content/en/articles
          if git diff --cached --quiet; then
            echo "No synced article changes."
            exit 0
          fi
          git commit -m "chore: sync zhihu articles and translations [skip ci]"
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.169.0"

      - name: Build
        run: |
          cd website
          # Pinned together with hugo-version: PaperMod's master raises the Hugo it needs.
          git init -q themes/PaperMod
          git -C themes/PaperMod fetch -q --depth=1 https://github.com/adityatelange/hugo-PaperMod.git 118119693d8b5ac211b939775678310973bcb232
          git -C themes/PaperMod checkout -q FETCH_HEAD
          hugo

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: website/public
